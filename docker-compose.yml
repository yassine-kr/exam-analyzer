# Step 2: app behind an Nginx reverse proxy with HTTPS (self-signed cert)
# Configuration is read from the .env file (copy .env.example to .env)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # no "ports": the app is only reachable through nginx

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - app

volumes:
  certs:
