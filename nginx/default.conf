# HTTP: Let's Encrypt challenge files, everything else redirected to HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS here, forward plain HTTP to the app container
server {
    listen 443 ssl;
    server_name _;

    # active.crt/key point to the Let's Encrypt certificate if there is one,
    # otherwise to a self-signed certificate (see 40-select-cert.sh)
    ssl_certificate     /etc/nginx/certs/active.crt;
    ssl_certificate_key /etc/nginx/certs/active.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
